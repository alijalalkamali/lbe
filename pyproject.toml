[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lbe"
version = "0.1.0"
description = "LLM Behavioral Eval — rigorous behavioral evaluation of small open-weights LLMs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Ali Jalal-Kamali"}
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/lbe/interp/probe.py" = ["N803", "N806"]  # sklearn X,y naming convention
"tests/test_interp.py" = ["N806"]             # same

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
